  </g>
  <g font-family="Arial, sans-serif" font-size="14" fill="#66737b" text-anchor="middle">
    <text x="290" y="309">0 %</text><text x="413" y="309">25 %</text><text x="535" y="309">50 %</text><text x="658" y="309">75 %</text><text x="780" y="309">100 %</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="17" fill="#1e2932">
