<svg xmlns="http://www.w3.org/2000/svg" width="880" height="390" viewBox="0 0 880 390" role="img" aria-labelledby="title desc">
  <title id="title">Accuracy des modèles sur le test chronologique du 21 octobre 2026</title>
  <desc id="desc">Sur les mêmes 63 avis de test, majorité apprise sur l'entraînement 22,2 %, Random Forest outfit-v2 28,6 %, modèle courant logistique articles et paires 42,9 %. Test unique déjà exploré, non indépendant.</desc>
