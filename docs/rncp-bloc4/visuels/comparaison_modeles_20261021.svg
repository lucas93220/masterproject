  <text x="42" y="80" font-family="Arial, sans-serif" font-size="15" fill="#57636b">Accuracy · même test chronologique hors ligne · 63 avis réels du compte récent</text>
  <g stroke="#d9ddde" stroke-width="1">
    <line x1="290" y1="106" x2="290" y2="289"/>
